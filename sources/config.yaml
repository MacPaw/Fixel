sources:
  - Fixel.designspace

familyName: Fixel

axisOrder:
  - wdth
  - wght

buildVariable: true
buildStatic: true
buildTTF: true
buildOTF: false
buildWebfont: true

vfDir: ../fonts/variable
ttDir: ../fonts/ttf
woffDir: ../fonts/webfonts

# Google Fonts profile: applies gftools-fix-font, sets vendor ID,
# fsType=0, regular default instance, STAT table, name table cleanup.
flattenComponents: true
decomposeTransformedComponents: true
includeSourceFixes: true
googleFonts: true

# Subspaced VFs are not needed — we keep a single VF with wdth+wght.

stat:
  - name: Width
    tag: wdth
    values:
      - name: Text
        value: 87.5
      - name: Display
        value: 100
        flags: 2
        linkedValue: 100
  - name: Weight
    tag: wght
    values:
      - name: Thin
        value: 100
      - name: ExtraLight
        value: 200
      - name: Light
        value: 300
      - name: Regular
        value: 400
        flags: 2
        linkedValue: 700
      - name: Medium
        value: 500
      - name: SemiBold
        value: 600
      - name: Bold
        value: 700
      - name: ExtraBold
        value: 800
      - name: Black
        value: 900
